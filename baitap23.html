
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đèn Kéo Quân - Bài Tập 23</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
        }

        .header-info {
            position: absolute;
            top: 20px;
            text-align: center;
        }

        .header-info h2 { margin: 0 0 5px 0; color: #f1c40f; }
        .header-info p { margin: 0; font-size: 0.9rem; color: #bdc3c7; }

    
        .scene {
            width: 250px;
            height: 350px;
            perspective: 1000px;
            margin-top: 50px;
        }

       
        .lantern {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateLantern 15s linear infinite;
        }

       
        .lantern.paused {
            animation-play-state: paused;
        }

     
        .face {
            position: absolute;
            width: 200px;
            height: 300px;
            left: 25px;
            top: 25px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid #e67e22;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(230, 126, 34, 0.5);
        }

        .face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

       
        .face:nth-child(1) { transform: rotateY(0deg) translateZ(180px); }
        .face:nth-child(2) { transform: rotateY(60deg) translateZ(180px); }
        .face:nth-child(3) { transform: rotateY(120deg) translateZ(180px); }
        .face:nth-child(4) { transform: rotateY(180deg) translateZ(180px); }
        .face:nth-child(5) { transform: rotateY(240deg) translateZ(180px); }
        .face:nth-child(6) { transform: rotateY(300deg) translateZ(180px); }

        @keyframes rotateLantern {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(360deg); }
        }

        .back-link {
            position: absolute;
            bottom: 20px;
            padding: 10px 20px;
            background: #e67e22;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .back-link:hover { background: #d35400; }
    </style>

    <script>
        const lantern = document.getElementById('lantern');

        
        lantern.addEventListener('mouseenter', () => {
            lantern.classList.add('paused');
        });

        
        lantern.addEventListener('mouseleave', () => {
            lantern.classList.remove('paused');
        });
